# Shiksha ERP — development stack (Phase 0.3)
# Usage: docker compose -f infra/compose.dev.yml --env-file infra/.env up -d
name: shiksha-dev

x-frappe: &frappe
  image: frappe/erpnext:v16
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - ../apps/shiksha:/home/frappe/frappe-bench/apps/shiksha
  environment: &frappe-env
    DB_HOST: db
    DB_PORT: "3306"
    REDIS_CACHE: redis-cache:6379
    REDIS_QUEUE: redis-queue:6379
    SOCKETIO_PORT: "9000"
  depends_on:
    db:
      condition: service_healthy
    redis-cache:
      condition: service_started
    redis-queue:
      condition: service_started

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set in infra/.env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h localhost --password=${DB_ROOT_PASSWORD}
      interval: 5s
      retries: 20

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped

  backend:
    <<: *frappe

  websocket:
    <<: *frappe
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  scheduler:
    <<: *frappe
    command: ["bench", "schedule"]

  queue-short:
    <<: *frappe
    command: ["bench", "worker", "--queue", "short,default"]

  queue-long:
    <<: *frappe
    command: ["bench", "worker", "--queue", "long,default,short"]

  frontend:
    <<: *frappe
    command: ["nginx-entrypoint.sh"]
    environment:
      <<: *frappe-env
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp.localhost}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
      - websocket

volumes:
  db-data:
  sites:
